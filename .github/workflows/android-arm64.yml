name: Android ARM64 experimental build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-arm64.yml'
      - 'docs/PORTING.md'

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Qt package availability
        shell: bash
        run: |
          python3 -m pip install --user aqtinstall==3.3.0
          python3 -m aqt list-qt linux android --arch 5.15.2
          python3 -m aqt list-qt linux android --modules 5.15.2 android_arm64_v8a
      - name: Install Qt 5.15 Android ARM64
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: 'qtsvg qtmultimedia qtserialport'
          cache: true
      - name: Install matching Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "y" | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" "ndk;21.3.6528147" "platforms;android-29" "build-tools;29.0.3"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/21.3.6528147" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/21.3.6528147" >> "${GITHUB_ENV}"
      - name: Fetch pinned original SimulIDE source
        run: |
          git clone https://github.com/Arcachofo/SimulIDE-dev.git upstream
          git -C upstream checkout a7d9fc9d3b8991b3b376cbd66fb0abb998f60797
      - name: Configure and compile original Qt application
        id: compile
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          cd upstream/build_XX
          qmake SimulIDE_Build.pro -spec android-clang CONFIG+=debug 2>&1 | tee ../../logs/qmake.log
          make -j2 2>&1 | tee ../../logs/make.log
      - name: Inspect build products
        if: always()
        run: |
          mkdir -p logs
          find upstream -type f \( -name '*.so' -o -name '*.apk' \) -print > logs/products.txt || true
          cat logs/products.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulide-android-arm64-diagnostics
          path: logs/
          if-no-files-found: warn
